[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-agent"
version = "2.0.0"
description = "Project Olympus — Autonomous SRE Engine with self-healing code repair"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
olympus = "cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
